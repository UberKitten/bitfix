name: Release

permissions:
  contents: write

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can build a changelog from previous tag

      - name: Compute version / tag / changelog
        id: meta
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sha_short=${GITHUB_SHA::7}
          tag="v${version}-${sha_short}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${sha_short}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          prev=$(git tag -l 'v*' --sort=-creatordate | head -n1 || true)
          {
            echo "## Changes"
            echo ""
            if [ -z "$prev" ] || ! git rev-parse "$prev" >/dev/null 2>&1; then
              git log --pretty='format:- %s' -n 20
            else
              echo "_Since [${prev}](../../releases/tag/${prev})_"
              echo ""
              git log --pretty='format:- %s (%h)' "${prev}..HEAD"
            fi
            echo ""
            echo ""
            echo "Built from \`${GITHUB_SHA}\`."
          } > release-notes.md

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-pc-windows-gnu

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Stage release
        run: |
          mkdir -p staging
          cp README.md LICENSE target/x86_64-pc-windows-gnu/release/bitfix.dll staging/
          cp -r fixes staging/

      - name: Archive
        run: cd staging && zip -r ../bitfix.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: bitfix ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: bitfix.zip
          fail_on_unmatched_files: true
          make_latest: "true"
